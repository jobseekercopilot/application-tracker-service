spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.h2.console.enabled=false
application-tracker.database.production-safety-check=false
services.document-store-service.base-url=
application-tracker.security.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json
application-tracker.security.issuer=test-issuer
application-tracker.security.audience=test-audience
application-tracker.security.service-identity.producer-token=test-only-application-producer-token-32-bytes
application-tracker.security.service-identity.reader-token=test-only-application-reader-token-32-bytes
application-tracker.security.environment-data-token=test-only-environment-data-token-32-bytes
