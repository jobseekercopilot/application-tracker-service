server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: application-tracker-service
  datasource:
    url: jdbc:h2:mem:applicationtracker
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health

services:
  document-store-service:
    base-url: ${DOCUMENT_STORE_SERVICE_URL:http://document-store-service:8089}
